name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # lockfileVersion 2 requires a recent bun (local canary produces it)
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
